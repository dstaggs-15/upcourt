name: Windows build and tests
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build game and run engine tests
        shell: powershell
        run: .\build.ps1
      - name: Render menus
        shell: powershell
        run: .\build\Upocourt.Tests.exe --ui-test
      - name: Package and verify installer
        shell: powershell
        run: .\build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Upocourt-Windows
          path: play me/*
